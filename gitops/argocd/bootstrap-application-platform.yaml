---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopdemo-platform
spec:
  project: default
  source:
    repoURL: https://gitlab.com/ClementV78/shopdemo.git
    targetRevision: main
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Synchronisation MANUELLE volontaire. Ce chemin porte les ressources
  # transverses du cluster, dont le namespace argocd : une erreur appliquee
  # automatiquement ici pourrait couper Argo CD de son propre depot Git, donc
  # de sa capacite a recevoir le correctif. La porte humaine rend ce scenario
  # impossible. Voir docs/sprints/sprint-1-gitops-local.md.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
