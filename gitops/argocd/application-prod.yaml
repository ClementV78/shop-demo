---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shopdemo
    shopdemo.io/environment: prod
spec:
  project: default
  source:
    repoURL: https://gitlab.com/ClementV78/shopdemo.git
    targetRevision: main
    path: gitops/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: shopdemo-prod
  # Synchronisation MANUELLE, en attendant S1-T6. Prod suit encore la branche
  # main : l'automatiser maintenant enverrait chaque commit directement en
  # production et supprimerait la frontiere avec staging. L'automatisation
  # viendra avec une source differente, les tags semver.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
