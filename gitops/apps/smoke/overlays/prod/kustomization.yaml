---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopdemo-prod
resources:
  - ../../base
# Meme raisonnement que pour staging : le label descriptif va sur les objets et
# sur les pods, jamais dans le selecteur du Deployment, qui est immuable apres
# creation.
labels:
  - pairs:
      shopdemo.io/environment: prod
    includeSelectors: false
    includeTemplates: true
