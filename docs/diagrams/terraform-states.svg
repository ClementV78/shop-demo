        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default"/>
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis"/>
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security"/>
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Boundaries (behind everything) -->
        <rect x="270" y="60" width="230" height="270" rx="12" class="c-region" stroke-width="1"/>
        <text x="278" y="78" class="t-cloud" font-size="9" font-weight="600">State bootstrap — permanent, jamais détruit</text>

        <rect x="620" y="60" width="250" height="270" rx="12" class="c-region" stroke-width="1"/>
        <text x="628" y="78" class="t-cloud" font-size="9" font-weight="600">State workload — détruit après chaque session</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 115 210 L 199.5 210 Q 207.5 210 207.5 202 L 207.5 128 Q 207.5 120 215.5 120 L 300 120" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
        <path d="M 115 270 L 374.5 270 Q 382.5 270 382.5 262 L 382.5 128 Q 382.5 120 390.5 120 L 650 120" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 470 120 L 650 120" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <rect x="30" y="210" width="170" height="60" rx="6" class="c-mask"/>
        <rect x="30" y="210" width="170" height="60" rx="6" class="c-external" stroke-width="1.5"/>
