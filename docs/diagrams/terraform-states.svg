        <text x="40" y="451" class="t-primary" font-size="9" font-weight="600">Legend</text>
        <rect x="40" y="456" width="14" height="9" rx="2" class="c-external" stroke-width="1"/>
        <text x="60" y="464" class="t-muted" font-size="8">External</text>
        <rect x="138" y="456" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="158" y="464" class="t-muted" font-size="8">Backend</text>
        <rect x="231" y="456" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="251" y="464" class="t-muted" font-size="8">Database</text>
        <rect x="329" y="456" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="349" y="464" class="t-muted" font-size="8">Security</text>
        <rect x="427" y="456" width="14" height="9" rx="2" class="c-cloud" stroke-width="1"/>
        <text x="447" y="464" class="t-muted" font-size="8">Cloud</text>
