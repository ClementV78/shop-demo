        <text x="115" y="254" class="t-muted" font-size="9" text-anchor="middle">tier gratuit, 400 min/mois</text>

        <rect x="300" y="90" width="170" height="60" rx="6" class="c-mask"/>
        <rect x="300" y="90" width="170" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="385" y="118" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">EC2 runner</text>
        <text x="385" y="134" class="t-muted" font-size="9" text-anchor="middle">Ubuntu t3.micro + GitLab runner</text>

        <rect x="300" y="170" width="170" height="60" rx="6" class="c-mask"/>
        <rect x="300" y="170" width="170" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="385" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">S3 tfstate workload</text>
        <text x="385" y="214" class="t-muted" font-size="9" text-anchor="middle">+ DynamoDB lock</text>

        <rect x="300" y="250" width="170" height="60" rx="6" class="c-mask"/>
        <rect x="300" y="250" width="170" height="60" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="385" y="278" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Provider OIDC</text>
        <text x="385" y="294" class="t-muted" font-size="9" text-anchor="middle">GitLab → AWS, rôle IAM scopé</text>

        <rect x="650" y="90" width="190" height="60" rx="6" class="c-mask"/>
        <rect x="650" y="90" width="190" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="745" y="118" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">VPC + EKS + Karpenter</text>
        <text x="745" y="134" class="t-muted" font-size="9" text-anchor="middle">Amazon Linux 2023</text>

        <rect x="650" y="170" width="190" height="60" rx="6" class="c-mask"/>
        <rect x="650" y="170" width="190" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="745" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">RDS · SNS/SQS</text>
        <text x="745" y="214" class="t-muted" font-size="9" text-anchor="middle">CloudFront/WAF</text>

        <rect x="650" y="250" width="190" height="60" rx="6" class="c-mask"/>
        <rect x="650" y="250" width="190" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="745" y="284" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Cognito · API GW · Lambda</text>

        <!-- Connection labels -->
        <rect x="201.4" y="10" width="197.2" height="14" rx="3" class="c-mask"/>
        <text x="300" y="20" class="t-messagebus" font-size="8" text-anchor="middle">apply/destroy bootstrap/ (rare, manuel)</text>
        <rect x="267.8" y="390" width="264.4" height="14" rx="3" class="c-mask"/>
        <text x="400" y="400" class="t-backend" font-size="8" text-anchor="middle">apply/destroy envs/staging/ (début et fin de session)</text>
        <rect x="478.2" y="100" width="163.6" height="14" rx="3" class="c-mask"/>
        <text x="560" y="110" class="t-muted" font-size="8" text-anchor="middle">kubectl apply, jobs réseau privé</text>

