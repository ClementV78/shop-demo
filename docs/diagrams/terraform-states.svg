<svg viewBox="0 0 1000 480" role="img" aria-label="IDP Platform — 2 states Terraform séparés — bootstrap (permanent) vs workload (éphémère) (architecture diagram)" width="1000" height="480" xmlns="http://www.w3.org/2000/svg"><style>@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
