---
- name: Configure Gitea organization and repositories for ShopDemo GitOps
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../group_vars/all.yml

  vars:
    gitea_setup_apply: false
    gitea_setup_url: >-
      {{ lookup('env', 'SHOPDEMO_GITEA_URL') | default('', true) }}
    gitea_setup_admin_token: >-
      {{ lookup('env', 'SHOPDEMO_GITEA_ADMIN_TOKEN') | default('', true) }}
    gitea_setup_org_name: shopdemo
    gitea_setup_org_full_name: ShopDemo Platform
    gitea_setup_repositories:
      - name: shopdemo-app
        description: ShopDemo application source repository.
        private: true
      - name: shopdemo-gitops
        description: Desired Kubernetes state consumed by Argo CD.
        private: true
      - name: shopdemo-platform
        description: Platform, infrastructure, and operations repository.
        private: true
    gitea_setup_gitops_bot_token_creation_enabled: false

  tasks:
    - name: Show Gitea setup execution plan
      ansible.builtin.debug:
        msg:
          purpose: >-
            Configure Gitea after Terraform and Helm expose the service.
          apply_enabled: "{{ gitea_setup_apply }}"
          url_source: Terraform/Helm output or SHOPDEMO_GITEA_URL
          token_source: External secret or SHOPDEMO_GITEA_ADMIN_TOKEN
          organization: "{{ gitea_setup_org_name }}"
          repositories: >-
            {{ gitea_setup_repositories | map(attribute='name') | list }}
          note: No Gitea API call happens unless gitea_setup_apply=true.

    - name: Assert Gitea setup inputs when apply is enabled
      ansible.builtin.assert:
        that:
          - gitea_setup_url | length > 0
          - gitea_setup_admin_token | length > 0
          - gitea_setup_org_name | length > 0
          - gitea_setup_repositories | length > 0
        fail_msg: >-
          gitea-setup.yml requires a Gitea URL, admin token, organization
          name, and repository list before applying.
      when: gitea_setup_apply | bool
      no_log: true

    - name: Check whether the ShopDemo organization exists
      ansible.builtin.uri:
        url: "{{ gitea_setup_url }}/api/v1/orgs/{{ gitea_setup_org_name }}"
        method: GET
        headers:
          Authorization: "token {{ gitea_setup_admin_token }}"
        status_code:
          - 200
          - 404
        return_content: true
      register: gitea_setup_org_lookup
      changed_when: false
      when: gitea_setup_apply | bool
      no_log: true

    - name: Create the ShopDemo organization when missing
      ansible.builtin.uri:
        url: "{{ gitea_setup_url }}/api/v1/orgs"
        method: POST
        headers:
          Authorization: "token {{ gitea_setup_admin_token }}"
        body_format: json
        body:
          username: "{{ gitea_setup_org_name }}"
          full_name: "{{ gitea_setup_org_full_name }}"
          visibility: limited
        status_code:
          - 201
      when:
        - gitea_setup_apply | bool
        - gitea_setup_org_lookup.status == 404
      no_log: true

    - name: Check whether ShopDemo repositories exist
      ansible.builtin.uri:
        url: >-
          {{ gitea_setup_url }}/api/v1/repos/{{ gitea_setup_org_name }}/{{
          item.name }}
        method: GET
        headers:
          Authorization: "token {{ gitea_setup_admin_token }}"
        status_code:
          - 200
          - 404
        return_content: true
      loop: "{{ gitea_setup_repositories }}"
      register: gitea_setup_repo_lookup
      changed_when: false
      when: gitea_setup_apply | bool
      no_log: true

    - name: Create missing ShopDemo repositories
      ansible.builtin.uri:
        url: >-
          {{ gitea_setup_url }}/api/v1/orgs/{{ gitea_setup_org_name }}/repos
        method: POST
        headers:
          Authorization: "token {{ gitea_setup_admin_token }}"
        body_format: json
        body:
          name: "{{ item.item.name }}"
          description: "{{ item.item.description }}"
          private: "{{ item.item.private }}"
          auto_init: true
        status_code:
          - 201
      loop: "{{ gitea_setup_repo_lookup.results | default([]) }}"
      when:
        - gitea_setup_apply | bool
        - item.status == 404
      no_log: true

    - name: Explain deferred GitOps bot token creation
      ansible.builtin.debug:
        msg: >-
          GitOps bot token creation is intentionally deferred until the Gitea
          version and token API contract are pinned. Provide the token through
          an external secret source for now.
      when:
        - gitea_setup_apply | bool
        - not gitea_setup_gitops_bot_token_creation_enabled | bool
