---
- name: Verify cilium-setup
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert k3s service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services["k3s.service"].state == "running"
        fail_msg: k3s service is not active after converge.

    - name: Read k3s service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/k3s.service
      register: k3s_unit

    - name: Assert k3s runs without kube-proxy
      ansible.builtin.assert:
        that:
          - >-
            '--disable-kube-proxy' in
            (k3s_unit.content | b64decode)
        fail_msg: >-
          k3s unit does not contain the expected disable-kube-proxy flag.

    - name: Check Helm release exists
      ansible.builtin.command:
        argv:
          - helm
          - list
          - --namespace
          - kube-system
          - --filter
          - "^cilium$"
          - --short
          - --kubeconfig
          - /home/molecule/.kube/config
      register: cilium_helm_release
      changed_when: false

    - name: Assert Helm release exists
      ansible.builtin.assert:
        that:
          - cilium_helm_release.stdout == "cilium"
        fail_msg: Helm release cilium is missing from kube-system.

    - name: Read Helm values for cilium release
      ansible.builtin.command:
        argv:
          - helm
          - get
          - values
          - cilium
          - --namespace
          - kube-system
          - --kubeconfig
          - /home/molecule/.kube/config
          - --all
      register: cilium_helm_values
      changed_when: false

    - name: Assert key Helm values are present
      ansible.builtin.assert:
        that:
          - "'kubeProxyReplacement: true' in cilium_helm_values.stdout"
          - >-
            'k8sServiceHost: ' ~
            ansible_facts['default_ipv4']['address'] in
            cilium_helm_values.stdout
          - "'k8sServicePort: 6443' in cilium_helm_values.stdout"
          - >-
            'devices: ' ~
            ansible_facts['default_ipv4']['interface'] in
            cilium_helm_values.stdout
          - "'replicas: 1' in cilium_helm_values.stdout"
          - "'mode: cluster-pool' in cilium_helm_values.stdout"
          - "'10.42.0.0/16' in cilium_helm_values.stdout"
          - "'clusterPoolIPv4MaskSize: 24' in cilium_helm_values.stdout"
          - "'relay:' in cilium_helm_values.stdout"
          - "'ui:' in cilium_helm_values.stdout"
        fail_msg: >-
          Cilium Helm values do not match the expected role configuration.

    - name: Check Kubernetes resources created by the chart
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /home/molecule/.kube/config
          - get
          - daemonset/cilium
          - deployment/cilium-operator
          - deployment/hubble-relay
          - deployment/hubble-ui
          - --namespace
          - kube-system
          - -o
          - name
      register: cilium_resources
      changed_when: false

    - name: Assert expected Cilium resources exist
      ansible.builtin.assert:
        that:
          - "'daemonset.apps/cilium' in cilium_resources.stdout"
          - "'deployment.apps/cilium-operator' in cilium_resources.stdout"
          - "'deployment.apps/hubble-relay' in cilium_resources.stdout"
          - "'deployment.apps/hubble-ui' in cilium_resources.stdout"
        fail_msg: One or more expected Cilium resources were not created.
